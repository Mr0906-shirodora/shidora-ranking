<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>城ドラ ランキング</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
  body {
    font-family: sans-serif;
    margin: 10px;
  }

  h2 {
    text-align: center;
    font-size: 20px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  th, td {
    border: 1px solid #ccc;
    padding: 6px;
    text-align: center;
    font-size: 14px;
  }

  th {
    background: #f0f0f0;
  }

  /* スマホ用 */
  @media (max-width: 600px) {
    h2 {
      font-size: 18px;
    }

    th, td {
      font-size: 12px;
      padding: 4px;
    }
  }
</style>
</head>
<body>
  <h1>城ドラ ランキング</h1>

  <div style="overflow-x:auto;">
    <table border="1">
    <thead>
      <tr>
        <th>順位</th>
        <th>名前</th>
        <th>勝</th>
        <th>負</th>
        <th>ポイント</th>
      </tr>
    </thead>
    <tbody id="ranking"></tbody>
  </table>
　</div>
  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzc51HnkouSrXdzYfz5BYoI_BcjqHKUJwgGL6I42gbi2EF92kQSjyl-9Wwx9ORgIEJwVw/exec";

    fetch(GAS_URL)
      .then(res => res.json())
      .then(data => {
        const tbody = document.getElementById("ranking");
        data.forEach(row => {
          const tr = document.createElement("tr");
  tr.innerHTML = `
  <td>${row.rank}</td>
  <td>${row.name}</td>
  <td>${row.win}</td>
  <td>${row.lose}</td>
  <td>${row.point}</td>
`;


          tbody.appendChild(tr);
        });
      });
  </script>
</body>
</html>
